<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ten10 Academy Snapshot Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #1a1a2e;
            --secondary: #16213e;
            --accent: #0f3460;
            --highlight: #e94560;
            --text: #333;
            --text-light: #666;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
            --shadow-lg: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            padding: 2.5rem 2rem;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-lg);
        }
        .header h1 { font-size: 2rem; font-weight: 700; margin-bottom: 0.25rem; }
        .header p { opacity: 0.8; font-size: 0.95rem; font-weight: 300; }

        .stats-bar {
            display: flex; justify-content: center;
            gap: 2rem; margin-top: 1rem; flex-wrap: wrap;
        }
        .stat { text-align: center; }
        .stat-number { font-size: 1.5rem; font-weight: 700; color: var(--highlight); }
        .stat-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.7; }

        .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }

        /* Filters */
        .filters-section {
            background: var(--card-bg); border-radius: 16px; padding: 1.5rem;
            margin-bottom: 2rem; box-shadow: var(--shadow); border: 1px solid var(--border);
        }
        .filters-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .filters-header h3 { font-size: 1rem; font-weight: 600; color: var(--primary); }
        .clear-filters {
            background: none; border: 1px solid var(--highlight); color: var(--highlight);
            padding: 0.4rem 1rem; border-radius: 20px; cursor: pointer;
            font-size: 0.8rem; font-weight: 500; transition: all 0.2s;
        }
        .clear-filters:hover { background: var(--highlight); color: white; }
        .filters-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
        .filter-group label {
            display: block; font-size: 0.75rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-light); margin-bottom: 0.4rem;
        }
        .filter-group select, .filter-group input {
            width: 100%; padding: 0.6rem 0.8rem; border: 1px solid var(--border);
            border-radius: 8px; font-size: 0.85rem; font-family: 'Inter', sans-serif;
            background: var(--bg); transition: border-color 0.2s;
        }
        .filter-group select:focus, .filter-group input:focus { outline: none; border-color: var(--accent); }

        .results-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding: 0 0.5rem; }
        .results-count { font-size: 0.9rem; color: var(--text-light); }
        .results-count strong { color: var(--primary); }

        /* Card Grid */
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.5rem; }

        .card {
            background: var(--card-bg); border-radius: 16px; overflow: hidden;
            box-shadow: var(--shadow); border: 1px solid var(--border);
            transition: all 0.3s ease; cursor: pointer; position: relative;
        }
        .card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: var(--accent); }
        .card-accent { height: 4px; background: linear-gradient(90deg, var(--highlight), var(--accent)); }
        .card-body { padding: 1.5rem; }
        .card-issue {
            display: inline-flex; align-items: center; gap: 0.4rem;
            background: var(--bg); padding: 0.25rem 0.75rem; border-radius: 20px;
            font-size: 0.7rem; font-weight: 600; color: var(--accent); margin-bottom: 0.75rem;
        }
        .card-name { font-size: 1.25rem; font-weight: 700; color: var(--primary); margin-bottom: 0.25rem; }
        .card-role { font-size: 0.85rem; color: var(--highlight); font-weight: 500; margin-bottom: 0.75rem; }
        .card-meta { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.75rem; }
        .meta-tag {
            display: inline-flex; align-items: center; gap: 0.3rem;
            padding: 0.2rem 0.6rem; background: var(--bg); border-radius: 6px;
            font-size: 0.72rem; color: var(--text-light); font-weight: 500;
        }
        .card-client { font-size: 0.85rem; color: var(--text); font-weight: 500; }
        .relocated-badge {
            position: absolute; top: 1rem; right: 1rem;
            background: #fef3c7; color: #92400e; padding: 0.2rem 0.5rem;
            border-radius: 4px; font-size: 0.65rem; font-weight: 600; text-transform: uppercase;
        }
        .edition-badge {
            position: absolute; top: 1rem; right: 1rem;
            background: linear-gradient(135deg, var(--highlight), #ff6b6b); color: white;
            padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.65rem; font-weight: 600;
        }

        /* Modal */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
            z-index: 1000; justify-content: center; align-items: flex-start;
            padding: 2rem; overflow-y: auto;
        }
        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--card-bg); border-radius: 20px; width: 100%;
            max-width: 900px; margin: auto;
            box-shadow: var(--shadow-lg); animation: modalIn 0.3s ease;
            overflow: hidden;
        }
        @keyframes modalIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .modal-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white; padding: 1.5rem 2rem; position: relative;
        }
        .modal-close {
            position: absolute; top: 1rem; right: 1.5rem;
            background: rgba(255,255,255,0.2); border: none; color: white;
            width: 36px; height: 36px; border-radius: 50%; font-size: 1.2rem;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: background 0.2s;
        }
        .modal-close:hover { background: rgba(255,255,255,0.3); }
        .modal-issue-badge {
            display: inline-block; background: rgba(255,255,255,0.15);
            padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.75rem;
            font-weight: 500; margin-bottom: 0.5rem;
        }
        .modal-name { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.2rem; }
        .modal-role { font-size: 0.9rem; opacity: 0.85; }

        .modal-content { padding: 1.5rem 2rem 2rem; }

        /* Meta pills in modal */
        .modal-meta-row {
            display: flex; flex-wrap: wrap; gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        .modal-meta-pill {
            background: var(--bg); border: 1px solid var(--border);
            padding: 0.35rem 0.8rem; border-radius: 20px;
            font-size: 0.78rem; color: var(--text); font-weight: 500;
        }
        .modal-meta-pill strong { color: var(--accent); margin-right: 0.3rem; }

        /* Image viewer */
        .modal-images {
            display: flex; flex-direction: column; gap: 1rem;
            align-items: center;
        }
        .modal-images img {
            width: 100%; max-width: 100%; border-radius: 12px;
            box-shadow: var(--shadow); border: 1px solid var(--border);
        }
        .modal-images .pdf-embed {
            width: 100%; height: 700px; border-radius: 12px;
            border: 1px solid var(--border);
        }
        .modal-images .page-label {
            font-size: 0.75rem; color: var(--text-light);
            font-weight: 500; text-align: center; margin-top: -0.5rem;
        }

        /* No results */
        .no-results { text-align: center; padding: 4rem 2rem; color: var(--text-light); }
        .no-results p { font-size: 1rem; margin-top: 0.5rem; }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 { font-size: 1.5rem; }
            .container { padding: 1rem; }
            .cards-grid { grid-template-columns: 1fr; }
            .filters-grid { grid-template-columns: 1fr 1fr; }
            .modal { margin: 0.5rem; }
            .modal-content { padding: 1rem; }
            .stats-bar { gap: 1rem; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Academy Snapshot Archive</h1>
        <p>Sharing what Junior Consultants are working on</p>
        <div class="stats-bar">
            <div class="stat"><div class="stat-number" id="stat-people">-</div><div class="stat-label">People</div></div>
            <div class="stat"><div class="stat-number" id="stat-issues">-</div><div class="stat-label">Issues</div></div>
            <div class="stat"><div class="stat-number" id="stat-clients">-</div><div class="stat-label">Clients</div></div>
            <div class="stat"><div class="stat-number" id="stat-academies">-</div><div class="stat-label">Cohorts</div></div>
        </div>
    </div>

    <div class="container">
        <div class="filters-section">
            <div class="filters-header">
                <h3>🔍 Filter Snapshots</h3>
                <button class="clear-filters" onclick="clearFilters()">Clear All</button>
            </div>
            <div class="filters-grid">
                <div class="filter-group">
                    <label>Search Name</label>
                    <input type="text" id="filter-search" placeholder="Type a name..." oninput="applyFilters()">
                </div>
                <div class="filter-group">
                    <label>Sector</label>
                    <select id="filter-sector" onchange="applyFilters()"><option value="">All Sectors</option></select>
                </div>
                <div class="filter-group">
                    <label>Role Type</label>
                    <select id="filter-role-cat" onchange="applyFilters()"><option value="">All Roles</option></select>
                </div>
                <div class="filter-group">
                    <label>Specialism</label>
                    <select id="filter-specialism" onchange="applyFilters()"><option value="">All Specialisms</option></select>
                </div>
                <div class="filter-group">
                    <label>Client</label>
                    <select id="filter-client" onchange="applyFilters()"><option value="">All Clients</option></select>
                </div>
                <div class="filter-group">
                    <label>Academy Cohort</label>
                    <select id="filter-academy" onchange="applyFilters()"><option value="">All Cohorts</option></select>
                </div>
                <div class="filter-group">
                    <label>Relocated</label>
                    <select id="filter-relocated" onchange="applyFilters()">
                        <option value="">All</option>
                        <option value="true">Yes - Relocated</option>
                        <option value="false">No</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Working Model</label>
                    <select id="filter-location" onchange="applyFilters()">
                        <option value="">All</option>
                        <option value="Remote">Remote</option>
                        <option value="Hybrid">Hybrid</option>
                        <option value="Office">Office/On-site</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Edition</label>
                    <select id="filter-edition" onchange="applyFilters()"><option value="">All Editions</option></select>
                </div>
            </div>
        </div>

        <div class="results-info">
            <div class="results-count">Showing <strong id="results-num">0</strong> results</div>
        </div>

        <div class="cards-grid" id="cards-container">
            <div class="no-results"><p>Loading snapshots...</p></div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
        <div class="modal" id="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <button class="modal-close" onclick="closeModal()" aria-label="Close modal">&times;</button>
                <div class="modal-issue-badge" id="modal-issue"></div>
                <div class="modal-name" id="modal-name"></div>
                <div class="modal-role" id="modal-role"></div>
            </div>
            <div class="modal-content">
                <div class="modal-meta-row" id="modal-meta"></div>
                <div class="modal-images" id="modal-images"></div>
            </div>
        </div>
    </div>

    <script>
    let allData = [];

    async function init() {
        try {
            const response = await fetch('snapshot_data.json');
            const data = await response.json();
            allData = data.entries;
            populateFilters();
            updateStats();
            applyFilters();
        } catch (err) {
            document.getElementById('cards-container').innerHTML =
                '<div class="no-results"><p>Error loading data. Make sure snapshot_data.json is accessible.</p></div>';
            console.error(err);
        }
    }

    function populateFilters() {
        const sectors = [...new Set(allData.map(e => e.sector))].filter(Boolean).sort();
        const roleCats = [...new Set(allData.map(e => e.roleCategory))].filter(Boolean).sort();
        const specialisms = [...new Set(allData.map(e => e.specialism))].filter(Boolean).sort();
        const clients = [...new Set(allData.map(e => e.client))].filter(Boolean).sort();
        const academies = [...new Set(allData.map(e => e.academy))].filter(Boolean).sort((a,b) => a-b);
        const editions = [...new Set(allData.map(e => e.editionType))].filter(Boolean).sort();

        fillSelect('filter-sector', sectors);
        fillSelect('filter-role-cat', roleCats);
        fillSelect('filter-specialism', specialisms);
        fillSelect('filter-client', clients);
        fillSelect('filter-academy', academies.map(String));
        fillSelect('filter-edition', editions);
    }

    function fillSelect(id, options) {
        const sel = document.getElementById(id);
        const firstOpt = sel.options[0].text;
        sel.innerHTML = `<option value="">${firstOpt}</option>`;
        options.forEach(opt => {
            const o = document.createElement('option');
            o.value = opt; o.textContent = opt;
            sel.appendChild(o);
        });
    }

    function updateStats() {
        const names = new Set(allData.map(e => e.name));
        const issues = new Set(allData.map(e => e.issue));
        const clients = new Set(allData.map(e => e.client).filter(c => c && !c.includes('Internal')));
        const academies = new Set(allData.map(e => e.academy).filter(Boolean));
        document.getElementById('stat-people').textContent = names.size;
        document.getElementById('stat-issues').textContent = issues.size;
        document.getElementById('stat-clients').textContent = clients.size;
        document.getElementById('stat-academies').textContent = academies.size;
    }

    function applyFilters() {
        const search = document.getElementById('filter-search').value.toLowerCase();
        const sector = document.getElementById('filter-sector').value;
        const roleCat = document.getElementById('filter-role-cat').value;
        const specialism = document.getElementById('filter-specialism').value;
        const client = document.getElementById('filter-client').value;
        const academy = document.getElementById('filter-academy').value;
        const relocated = document.getElementById('filter-relocated').value;
        const location = document.getElementById('filter-location').value;
        const edition = document.getElementById('filter-edition').value;

        const filtered = allData.filter(entry => {
            if (search && !entry.name.toLowerCase().includes(search)) return false;
            if (sector && entry.sector !== sector) return false;
            if (roleCat && entry.roleCategory !== roleCat) return false;
            if (specialism && entry.specialism !== specialism) return false;
            if (client && entry.client !== client) return false;
            if (academy && String(entry.academy) !== academy) return false;
            if (relocated === 'true' && !entry.relocated) return false;
            if (relocated === 'false' && entry.relocated) return false;
            if (location) {
                const loc = (entry.location || '').toLowerCase();
                if (location === 'Remote' && !loc.includes('remote')) return false;
                if (location === 'Hybrid' && !loc.includes('hybrid')) return false;
                if (location === 'Office' && !loc.includes('office') && !loc.includes('on-site') && !loc.includes('site')) return false;
            }
            if (edition && entry.editionType !== edition) return false;
            return true;
        });

        // Sort by issue number descending (newest first)
        filtered.sort((a, b) => b.issue - a.issue);

        document.getElementById('results-num').textContent = filtered.length;
        renderCards(filtered);
    }

    function renderCards(entries) {
        const container = document.getElementById('cards-container');
        if (entries.length === 0) {
            container.innerHTML = '<div class="no-results"><p>No snapshots match your filters. Try adjusting or clearing them.</p></div>';
            return;
        }

        container.innerHTML = entries.map((entry, idx) => {
            const badgeHtml = entry.editionType && entry.editionType !== 'Standard'
                ? `<div class="edition-badge">${entry.editionType}</div>`
                : entry.relocated
                    ? `<div class="relocated-badge">📍 Relocated</div>`
                    : '';

            return `
            <div class="card" onclick="openModal(${allData.indexOf(entry)})">
                <div class="card-accent"></div>
                ${badgeHtml}
                <div class="card-body">
                    <div class="card-issue">📰 Issue ${entry.issue} • ${entry.date}</div>
                    <div class="card-name">${entry.name}</div>
                    <div class="card-role">${entry.role}</div>
                    <div class="card-meta">
                        <span class="meta-tag">🏢 ${entry.client}</span>
                        ${entry.academy ? `<span class="meta-tag">🎓 A${entry.academy}</span>` : ''}
                        <span class="meta-tag">🏷️ ${entry.roleCategory}</span>
                        ${entry.specialism ? `<span class="meta-tag">⚡ ${entry.specialism}</span>` : ''}
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    function openModal(index) {
        const entry = allData[index];
        document.getElementById('modal-issue').textContent = `Issue ${entry.issue} • ${entry.date}`;
        document.getElementById('modal-name').textContent = entry.name;
        document.getElementById('modal-role').textContent = `${entry.role} at ${entry.client}`;

        // Build meta pills
        const metaHtml = [];
        if (entry.academy) metaHtml.push(`<span class="modal-meta-pill"><strong>Academy</strong> ${entry.academy}</span>`);
        metaHtml.push(`<span class="modal-meta-pill"><strong>Role Type</strong> ${entry.roleCategory}</span>`);
        if (entry.specialism) metaHtml.push(`<span class="modal-meta-pill"><strong>Specialism</strong> ${entry.specialism}</span>`);
        metaHtml.push(`<span class="modal-meta-pill"><strong>Sector</strong> ${entry.sector}</span>`);
        metaHtml.push(`<span class="modal-meta-pill"><strong>Location</strong> ${entry.location}</span>`);
        if (entry.methodology) metaHtml.push(`<span class="modal-meta-pill"><strong>Methodology</strong> ${entry.methodology}</span>`);
        if (entry.relocated) {
            const reloc = entry.relocationDetails || 'Yes';
            metaHtml.push(`<span class="modal-meta-pill"><strong>📍 Relocated</strong> ${reloc}</span>`);
        }
        if (entry.tools && entry.tools.length > 0) {
            metaHtml.push(`<span class="modal-meta-pill"><strong>Tools</strong> ${entry.tools.join(', ')}</span>`);
        }
        if (entry.award) {
            metaHtml.push(`<span class="modal-meta-pill"><strong>🏆 Award</strong> ${entry.award}</span>`);
        }
        document.getElementById('modal-meta').innerHTML = metaHtml.join('');

        // Build images/PDFs viewer
        const imagesContainer = document.getElementById('modal-images');
        const files = entry.sourceFiles || [];

        if (files.length === 0) {
            imagesContainer.innerHTML = '<p style="color:var(--text-light);text-align:center;">No source files available for this entry.</p>';
        } else {
            imagesContainer.innerHTML = files.map((file, i) => {
                const ext = file.split('.').pop().toLowerCase();
                if (ext === 'png' || ext === 'jpg' || ext === 'jpeg') {
                    return `
                        <img src="${encodeURI(file)}" alt="${entry.name} - Page ${i + 1}" loading="lazy">
                        ${files.length > 1 ? `<div class="page-label">Page ${i + 1} of ${files.length}</div>` : ''}
                    `;
                } else if (ext === 'pdf') {
                    return `
                        <iframe class="pdf-embed" src="${encodeURI(file)}" title="${entry.name} - Document ${i + 1}"></iframe>
                        ${files.length > 1 ? `<div class="page-label">Document ${i + 1} of ${files.length}</div>` : ''}
                    `;
                } else if (ext === 'mp4') {
                    return `
                        <video controls style="width:100%;border-radius:12px;">
                            <source src="${encodeURI(file)}" type="video/mp4">
                            Your browser does not support the video tag.
                        </video>
                    `;
                }
                return '';
            }).join('');
        }

        document.getElementById('modal-overlay').classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeModal(event) {
        if (event && event.target !== document.getElementById('modal-overlay')) return;
        document.getElementById('modal-overlay').classList.remove('active');
        document.body.style.overflow = '';
        // Stop any video playing
        const videos = document.querySelectorAll('#modal-images video');
        videos.forEach(v => v.pause());
    }

    // Close on Escape key
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeModal();
    });

    function clearFilters() {
        document.getElementById('filter-search').value = '';
        document.getElementById('filter-sector').value = '';
        document.getElementById('filter-role-cat').value = '';
        document.getElementById('filter-specialism').value = '';
        document.getElementById('filter-client').value = '';
        document.getElementById('filter-academy').value = '';
        document.getElementById('filter-relocated').value = '';
        document.getElementById('filter-location').value = '';
        document.getElementById('filter-edition').value = '';
        applyFilters();
    }

    // Initialize
    init();
    </script>
</body>
</html>
