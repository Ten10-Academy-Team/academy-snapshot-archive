<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Academy Snapshot</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--pri:#1a1a2e;--acc:#0f3460;--hl:#e94560;--txt:#333;--txtl:#666;--bg:#f7f8fa;--card:#fff;--brd:#e2e8f0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--txt);line-height:1.5}
.topbar{background:linear-gradient(135deg,var(--pri),var(--acc));color:#fff;padding:0.5rem 1.2rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar-title{font-size:0.85rem;font-weight:600}
.topbar-stats{display:flex;gap:1.2rem;font-size:0.75rem}
.topbar-stats strong{color:var(--hl);font-size:0.9rem;margin-right:0.2rem}
.search-bar{padding:0.6rem 1rem;background:var(--card);border-bottom:1px solid var(--brd);display:flex;gap:0.5rem;align-items:center;position:sticky;top:34px;z-index:49;flex-wrap:wrap}
.search-bar input{flex:1;min-width:150px;padding:0.45rem 0.8rem;border:1px solid var(--brd);border-radius:8px;font-size:0.82rem;font-family:inherit;background:var(--bg)}
.search-bar input:focus{outline:none;border-color:var(--acc)}
.search-bar select{padding:0.45rem 0.5rem;border:1px solid var(--brd);border-radius:8px;font-size:0.78rem;font-family:inherit;background:var(--bg);max-width:150px}
.search-bar select:focus{outline:none;border-color:var(--acc)}
.search-bar .count{font-size:0.72rem;color:var(--txtl);white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:0.75rem;padding:0.75rem 1rem}
a.card{background:var(--card);border-radius:10px;overflow:hidden;border:1px solid var(--brd);cursor:pointer;transition:all 0.2s;text-decoration:none;color:inherit;display:block;position:relative}
a.card:hover{transform:translateY(-2px);box-shadow:0 8px 16px rgba(0,0,0,0.08);border-color:var(--acc)}
.card-bar{height:3px;background:linear-gradient(90deg,var(--hl),var(--acc))}
.card-body{padding:0.8rem 1rem}
.card-issue{font-size:0.62rem;font-weight:600;color:var(--acc);background:var(--bg);display:inline-block;padding:0.1rem 0.5rem;border-radius:10px;margin-bottom:0.4rem}
.card-name{font-size:1rem;font-weight:700;color:var(--pri);margin-bottom:0.1rem}
.card-role{font-size:0.76rem;color:var(--hl);font-weight:500;margin-bottom:0.4rem}
.card-tags{display:flex;flex-wrap:wrap;gap:0.3rem}
.tag{font-size:0.64rem;padding:0.12rem 0.4rem;background:var(--bg);border-radius:4px;color:var(--txtl);font-weight:500}
.badge{position:absolute;top:0.6rem;right:0.6rem;font-size:0.58rem;font-weight:600;padding:0.1rem 0.35rem;border-radius:3px}
.badge-reloc{background:#fef3c7;color:#92400e}
.badge-ed{background:var(--hl);color:#fff}
.empty{text-align:center;padding:3rem;color:var(--txtl);font-size:0.9rem}
@media(max-width:600px){.grid{grid-template-columns:1fr}.search-bar select{max-width:100%}}
</style>
</head>
<body>
<div class="topbar">
<span class="topbar-title">Academy Snapshot Archive</span>
<div class="topbar-stats"><span><strong id="s-ppl">-</strong> People</span><span><strong id="s-iss">-</strong> Issues</span><span><strong id="s-cli">-</strong> Clients</span></div>
</div>
<div class="search-bar">
<input type="text" id="q" placeholder="Search name, client, role..." oninput="filter()">
<select id="f-role" onchange="filter()"><option value="">All Roles</option></select>
<select id="f-spec" onchange="filter()"><option value="">All Specialisms</option></select>
<select id="f-sector" onchange="filter()"><option value="">All Sectors</option></select>
<span class="count" id="count"></span>
</div>
<div class="grid" id="grid"></div>

const BASE='https://ten10-academy-team.github.io/academy-snapshot-archive/';
const roles=[...new Set(D.map(e=>e.rc))].filter(Boolean).sort();
const specs=[...new Set(D.map(e=>e.sp))].filter(Boolean).sort();
const sectors=[...new Set(D.map(e=>e.s))].filter(Boolean).sort();

document.getElementById('s-ppl').textContent=new Set(D.map(e=>e.n)).size;
document.getElementById('s-iss').textContent=new Set(D.map(e=>e.i)).size;
document.getElementById('s-cli').textContent=new Set(D.map(e=>e.c).filter(c=>c&&!c.includes('Internal'))).size;

function fillSel(id,opts){const s=document.getElementById(id);const f=s.options[0].text;s.innerHTML=`<option value="">${f}</option>`+opts.map(o=>`<option value="${o}">${o}</option>`).join('')}
fillSel('f-role',roles);fillSel('f-spec',specs);fillSel('f-sector',sectors);

function filter(){
    const q=document.getElementById('q').value.toLowerCase();
    const r=document.getElementById('f-role').value;
    const sp=document.getElementById('f-spec').value;
    const se=document.getElementById('f-sector').value;
    const res=D.filter(e=>{
        if(q){const hay=(e.n+' '+e.c+' '+e.r+' '+(e.sp||'')).toLowerCase();if(!hay.includes(q))return false}
        if(r&&e.rc!==r)return false;
        if(sp&&e.sp!==sp)return false;
        if(se&&e.s!==se)return false;
        return true;
    }).sort((a,b)=>b.i-a.i);
    document.getElementById('count').textContent=res.length+' of '+D.length;
    render(res);
}

function render(items){
    const g=document.getElementById('grid');
    if(!items.length){g.innerHTML='<div class="empty">No matches found</div>';return}
    g.innerHTML=items.map(e=>{
        const badge=e.rl?'<span class="badge badge-reloc">Relocated</span>':'';
        return `<a class="card" href="${BASE}" target="_blank" rel="noopener">
<div class="card-bar"></div>${badge}
<div class="card-body">
<div class="card-issue">Issue ${e.i} · ${e.d}</div>
<div class="card-name">${e.n}</div>
<div class="card-role">${e.r}</div>
<div class="card-tags">
<span class="tag">${e.c}</span>
${e.a?`<span class="tag">A${e.a}</span>`:''}
<span class="tag">${e.rc}</span>
${e.sp?`<span class="tag">${e.sp}</span>`:''}
</div>
</div></a>`}).join('');
}
filter();
